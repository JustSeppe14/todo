<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To-Do</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#222; --muted:#888; --accent:#4f7cff; --line:#e6e8ec; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181d; --card:#1f222a; --text:#eee; --muted:#8a8f9a; --accent:#6b93ff; --line:#2c303a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.4 system-ui,sans-serif; }
  main { max-width:520px; margin:40px auto; padding:0 16px; }
  h1 { font-size:1.6rem; margin:0 0 16px; }
  form { display:flex; gap:8px; margin-bottom:16px; }
  input[type=text] { flex:1; padding:12px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--text); font-size:1rem; }
  button { border:0; border-radius:8px; background:var(--accent); color:#fff; padding:0 16px; font-size:1rem; cursor:pointer; }
  ul { list-style:none; margin:0; padding:0; background:var(--card); border-radius:10px; overflow:hidden; }
  li { display:flex; align-items:center; gap:12px; padding:12px 14px; border-bottom:1px solid var(--line); }
  li:last-child { border-bottom:0; }
  li span { flex:1; word-break:break-word; }
  li.done span { text-decoration:line-through; color:var(--muted); }
  li input { width:18px; height:18px; }
  li .del { background:none; color:var(--muted); padding:0 4px; font-size:1.2rem; }
  li .del:hover { color:#e5484d; }
  footer { display:flex; justify-content:space-between; margin-top:12px; color:var(--muted); font-size:.9rem; }
  footer button { background:none; color:var(--muted); padding:0; font-size:.9rem; }
  .empty { padding:20px; text-align:center; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>To-Do</h1>
  <form id="form">
    <input id="input" type="text" placeholder="Add a task…" autocomplete="off" required>
    <button>Add</button>
  </form>
  <ul id="list"></ul>
  <footer>
    <span id="count"></span>
    <button id="clear">Clear completed</button>
  </footer>
</main>
<script>
  const KEY = "todos-v1";
  let todos = [];
  try { todos = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) {}

  const list = document.getElementById("list");
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(todos)); } catch (e) {} };

  function render() {
    list.innerHTML = "";
    if (!todos.length) list.innerHTML = '<div class="empty">Nothing to do 🎉</div>';
    todos.forEach((t, i) => {
      const li = document.createElement("li");
      if (t.done) li.className = "done";
      const cb = document.createElement("input");
      cb.type = "checkbox"; cb.checked = t.done;
      cb.onchange = () => { t.done = cb.checked; save(); render(); };
      const span = document.createElement("span");
      span.textContent = t.text;
      const del = document.createElement("button");
      del.className = "del"; del.textContent = "×"; del.title = "Delete";
      del.onclick = () => { todos.splice(i, 1); save(); render(); };
      li.append(cb, span, del);
      list.append(li);
    });
    const left = todos.filter(t => !t.done).length;
    document.getElementById("count").textContent = left + " item" + (left === 1 ? "" : "s") + " left";
  }

  document.getElementById("form").onsubmit = e => {
    e.preventDefault();
    const input = document.getElementById("input");
    const text = input.value.trim();
    if (!text) return;
    todos.push({ text, done: false });
    input.value = "";
    save(); render();
  };
  document.getElementById("clear").onclick = () => {
    todos = todos.filter(t => !t.done); save(); render();
  };
  render();
</script>
</body>
</html>
